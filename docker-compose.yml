# VeilKeeper local/homelab Docker Compose.
#
# IMPORTANT: this project shares a Docker host (MACMINI) with an unrelated
# parallel implementation of the same spec ("Veil Keepers", built with
# Qoder+Kimi K3, compose project `vk-sprint3`). The explicit `name:` below
# and the non-default host port keep the two stacks from colliding. Do not
# rename these without checking `docker ps` first.
name: veilkeeper

services:
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: veilkeeper-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      HTTP_PORT: "8080"
      DB_HOST: mysql
      DB_PORT: "3306"
    ports:
      # Host port 18091 -- NOT 18080, which is already used by the Qoder
      # build's `vk-sprint3-veilkeepers-api-1` container on this same host.
      - "18091:8080"
    volumes:
      - ./data/attachments:/data/attachments
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    # Resource-conscious limits for a homelab host (SPEC-BASE.md Section 52,
    # CLAUDE.md Sprint 7 scope). The Go binary is a static, stdlib-only
    # single-process server -- idle RSS is a few MB, so these caps are
    # generous headroom, not a tight fit. Measured actual usage during
    # Sprint 7 verification is documented in CLAUDE.md's Current State.
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 256M
        reservations:
          memory: 64M

  mysql:
    image: mysql:8.4
    container_name: veilkeeper-mysql
    restart: unless-stopped
    env_file:
      - .env
    environment:
      MYSQL_DATABASE: "${DB_NAME}"
      MYSQL_USER: "${DB_USER}"
      MYSQL_PASSWORD: "${DB_PASSWORD}"
      MYSQL_ROOT_PASSWORD: "${DB_ROOT_PASSWORD}"
    # Homelab single-user tuning (SPEC-BASE.md Section 52, CLAUDE.md Sprint 7
    # scope): MySQL 8's out-of-the-box footprint is dominated by
    # performance_schema instrumentation tables (~250-300M by itself),
    # sized for production observability on a dedicated DB host we don't
    # need here. Disabling it plus an explicit (still generous for our
    # workload) buffer pool cut measured idle RSS roughly in half -- see
    # CLAUDE.md's Current State for the before/after `docker stats` numbers.
    command:
      - --performance-schema=OFF
      - --innodb-buffer-pool-size=96M
    # No host port published -- internal-only, matching the good practice
    # the Qoder build already follows on this same host.
    volumes:
      - veilkeeper-mysql-data:/var/lib/mysql
      - ./infra/mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    # MySQL is the heavier of the two services but this is still a
    # single-user homelab vault, not a multi-tenant OLTP workload -- 512M is
    # comfortable headroom over MySQL 8.4's typical idle footprint
    # (~150-250M with default buffer pool sizing) without letting a runaway
    # query starve other containers on the shared MACMINI host (Docker-wide
    # limit ~7.65GB across many other stacks -- see CLAUDE.md).
    deploy:
      resources:
        limits:
          cpus: "1.5"
          memory: 512M
        reservations:
          memory: 128M

  # Web Sprint 8 -- static Vue SPA build served by nginx. LAN-ONLY by
  # policy (CLAUDE.md "Web client (Sprint roadmap)"): this service must
  # NEVER be added to ~/.cloudflared/config.yml or otherwise exposed
  # publicly, unlike `api` above which is deliberately public. Reachable via
  # https://<MACMINI-LAN-IP>:18092 from devices on the local network (HTTPS,
  # not HTTP -- see the cert volume below and CLAUDE.md "Web Sprint 8": the
  # Web Crypto API vault crypto depends on requires a secure context, which
  # plain-HTTP LAN IPs don't get).
  web:
    build:
      context: ./web
      dockerfile: Dockerfile
      args:
        # Points at the live public backend -- the Web app itself is
        # LAN-only, but it still calls the same real backend Android uses
        # (there is no separate "LAN backend"). See CLAUDE.md.
        VITE_API_BASE_URL: https://veilkeeper.quezacolt.my.id/
    container_name: veilkeeper-web
    restart: unless-stopped
    ports:
      # Host port 18092 -- not 80 (taken by beacon_frontend on this same
      # MACMINI host), not 18091/18080 (this repo's own API / the Qoder
      # build's API). Verified free via `docker ps` before picking it.
      # Same port as before this HTTPS follow-up -- only the protocol
      # changed, not the port.
      - "18092:8080"
    volumes:
      # Self-signed TLS cert/key for this host's LAN IP -- generate with
      # `web/nginx/certs/generate-cert.sh` before first `up` (and after any
      # regeneration/rotation). Mounted at deploy time rather than baked
      # into the image so the cert can be regenerated without a rebuild.
      # Read-only: nginx only ever reads these.
      - ./web/nginx/certs:/etc/nginx/certs:ro
    # Static nginx serving pre-built files -- no dependency on api/mysql
    # at the container level (the SPA calls the live public backend
    # directly from the browser, not through this container).
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 64M
        reservations:
          memory: 16M

volumes:
  veilkeeper-mysql-data:
