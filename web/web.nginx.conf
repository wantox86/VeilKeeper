# Minimal static-file server for the built Vue SPA. No reverse proxy to the
# backend here -- the SPA talks to the backend API directly from the browser
# (VITE_API_BASE_URL, baked in at build time), CORS-mediated (see
# backend/internal/httpserver/cors.go). This is homelab-scale static file
# serving only, deliberately not a general-purpose nginx config -- see
# CLAUDE.md "Final Architecture Principle" (no overengineering).
#
# HTTPS-only (Web Sprint 8 secure-context follow-up, see CLAUDE.md): the Web
# Crypto API (crypto.subtle) that this whole app's vault crypto depends on
# only works in a browser "secure context" -- HTTPS, or localhost. Plain
# LAN-IP HTTP is not a secure context. This listens on the *same* internal
# port (8080, still mapped to host 18092) with TLS instead of adding a
# second port -- there's no other listener to redirect from, so a
# redirect/dual-mode setup would just be unused complexity. Cert/key are a
# self-signed pair for this host's LAN IP, generated by
# web/nginx/certs/generate-cert.sh and bind-mounted in (never baked into the
# image or committed -- see docker-compose.yml and repo .gitignore). Every
# device on the LAN must manually trust this cert once (see README.md).
server {
    listen 8080 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/cert.pem;
    ssl_certificate_key /etc/nginx/certs/key.pem;

    root /usr/share/nginx/html;
    index index.html;

    # vue-router uses history mode (createWebHistory) -- any path that isn't
    # a real static file must fall back to index.html so client-side routing
    # can take over (e.g. a hard refresh on /dashboard).
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Long-lived caching for Vite's content-hashed build assets.
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
